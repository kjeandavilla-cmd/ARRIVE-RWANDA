<section class="hero">
    <h1 data-en="My Profile">Mon Profil</h1>
    <p data-en="Manage your information and bookings">Gérez vos informations et vos réservations</p>
</section>


<section id="profileContent" style="padding: 20px;">

    <div class="card" style="max-width: 500px; margin: 0 auto 30px;">
        <h3 data-en="👤 My Information">👤 Mes informations</h3>
        <p id="profileNom">Chargement...</p>
        <p id="profileEmail"></p>
    </div>

    <h2 data-en="My Bookings">Mes réservations</h2>
    <div id="myReservationsList"></div>
<h2 style="margin-top: 50px;" data-en="Leave a Review">Laisser un avis</h2>

<div class="form-container" style="margin-top: 20px;">
    <form id="avisForm">
        <p id="avisMessage" class="form-message"></p>

        <label for="avisNote" data-en="Your rating">Votre note</label>
        <select id="avisNote" required>
            <option value="" data-en="-- Choose --">-- Choisissez --</option>
            <option value="5" data-en="⭐⭐⭐⭐⭐ Excellent">⭐⭐⭐⭐⭐ Excellent</option>
            <option value="4" data-en="⭐⭐⭐⭐ Very Good">⭐⭐⭐⭐ Très bien</option>
            <option value="3" data-en="⭐⭐⭐ Fair">⭐⭐⭐ Correct</option>
            <option value="2" data-en="⭐⭐ Disappointing">⭐⭐ Décevant</option>
            <option value="1" data-en="⭐ Poor">⭐ Mauvais</option>
        </select>

        <label for="avisTexte" data-en="Your comment">Votre commentaire</label>
        <textarea id="avisTexte" placeholder="Partagez votre expérience avec ARRIVE" rows="4" required></textarea>

        <button type="submit" data-en="Post My Review">Publier mon avis</button>
    </form>
</div>
</section>
